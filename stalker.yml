name: Master Stalker Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  stalking_job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Stalker
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python stalker.py

    - name: Commit and Push History Changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create the file if it doesn't exist yet to avoid git errors
        touch stalked_links.txt
        
        git add stalked_links.txt || true
        
        # Only commit and push if there are actual changes in the file
        if ! git diff --quiet stalked_links.txt; then
          git commit -m "Update stalking history log [skip ci]"
          git push origin HEAD
        else
          print("No new positions found. History log is unchanged.")
